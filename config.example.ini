; PTZ Desk settings. Copy this file to config.ini and fill in your camera's details.
; config.ini is not version-controlled (it holds the camera password).
; Restart the server after every change (close the window, run start.bat again).

[camera]
ip = 192.168.1.100
; ONVIF port from the camera web interface (Network > ONVIF Settings)
onvif_port = 8080
; Port of the camera web interface
web_port = 80
; Control path: auto = camera web API (falls back to ONVIF) | web | onvif
control = auto
; Login as for the camera web interface
user = admin
password =

; RTSP addresses from the camera web interface (Network > RTSP Settings, "Copy" button)
rtsp_main = rtsp://192.168.1.100:554/live/av0
rtsp_sub = rtsp://192.168.1.100:554/live/av1

[server]
port = 8765
; yes = control page only reachable on this computer
; no  = also from other devices on your network (e.g. a tablet) via http://<this computer's IP>:8765
local_only = yes
open_browser = yes

[recording]
; Folder for recordings. Empty = "Videos/PTZ Desk" in your user folder.
folder =
; Start a new file every N minutes (0 = one continuous file)
split_minutes = 30
; Which stream is recorded: main (full resolution) or sub
stream = main
