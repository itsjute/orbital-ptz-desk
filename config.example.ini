; Orbital settings. The app writes config.ini itself when you enter the camera under
; Settings -> Camera; this file only documents the options for editing by hand.
; config.ini lives in the data folder (%APPDATA%\Orbital for the installed app, next to
; server.py when run from source) and is not version-controlled (it holds the camera password).
; After editing by hand, restart Orbital.

[camera]
ip = 192.168.1.100
; ONVIF port from the camera web interface (Network > ONVIF Settings)
onvif_port = 8080
; Port of the camera web interface
web_port = 80
; Control path: auto = camera web API (falls back to ONVIF) | web | onvif
control = auto
; Login as for the camera web interface
user = admin
password =

; RTSP addresses from the camera web interface (Network > RTSP Settings, "Copy" button).
; Empty = rtsp://<ip>:554/live/av0 and /live/av1
rtsp_main = rtsp://192.168.1.100:554/live/av0
rtsp_sub = rtsp://192.168.1.100:554/live/av1

[server]
port = 8765
; yes = control page only reachable on this computer
; no  = also from other devices on your network (e.g. a tablet) via http://<this computer's IP>:8765
local_only = yes
; server.py only: open the page in the browser on start
open_browser = yes

[recording]
; Folder for recordings. Empty = "Videos/Orbital" in your user folder.
folder =
; Start a new file every N minutes (0 = one continuous file)
split_minutes = 30
; Which stream is recorded: main (full resolution) or sub
stream = main
